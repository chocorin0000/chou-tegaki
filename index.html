<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>超！手書き</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="超！手書き">
<meta name="theme-color" content="#2E3A46">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --bar: #2E3A46; --btn: #465665; --paper: #FFFDF5; --desk: #EDE7DA;
  --sa-t: env(safe-area-inset-top, 0px); --sa-b: env(safe-area-inset-bottom, 0px);
  --sa-l: env(safe-area-inset-left, 0px); --sa-r: env(safe-area-inset-right, 0px);
}
html.rot90 {
  --sa-t: env(safe-area-inset-right, 0px); --sa-r: env(safe-area-inset-bottom, 0px);
  --sa-b: env(safe-area-inset-left, 0px); --sa-l: env(safe-area-inset-top, 0px);
}
html.rot270 {
  --sa-t: env(safe-area-inset-left, 0px); --sa-r: env(safe-area-inset-top, 0px);
  --sa-b: env(safe-area-inset-right, 0px); --sa-l: env(safe-area-inset-bottom, 0px);
}
#list-head .btn.rot { padding: 0 10px; margin-right: 6px; background: #5A6B7A; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: var(--bar); color: #222;
  font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  overscroll-behavior: none; -webkit-text-size-adjust: 100%;
}
.screen {
  position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bar);
  padding: var(--sa-t) var(--sa-r) var(--sa-b) var(--sa-l);
}
.screen[hidden] { display: none; }
html.full .screen { position: absolute; }
canvas { touch-action: none; display: block; }
button { font: inherit; touch-action: manipulation; }

/* ボタン */
.btn {
  flex: 1; min-width: 0; border: 0; border-radius: 8px; background: var(--btn); color: #fff;
  font-size: 17px; padding: 0 2px; margin: 3px; line-height: 1.15; cursor: pointer;
}
.btn:active { filter: brightness(1.25); }
.btn.on { background: #FFC94D !important; color: #2E2A20 !important; font-weight: bold; }
.btn.wide { display: block; width: 100%; margin: 8px 0 0; height: 48px; font-size: 16px; }
.bar { display: flex; flex: 0 0 auto; padding: 3px; }

/* 一覧 */
#list-head { display: flex; align-items: center; padding: 6px 8px 6px 16px; }
#list-head .title { flex: 1; color: #fff; font-size: 20px; font-weight: bold; }
#list-head .title .cho { color: #FFC94D; font-size: 29px; }
#list-head .btn { flex: 0 0 auto; height: 44px; padding: 0 14px; font-size: 16px; }
#list-row2 { display: flex; align-items: center; padding: 0 8px 6px 16px; gap: 2px; }
#list-row2 .cloud { flex: 1; color: #C8D2DC; font-size: 13px; white-space: pre-line; min-width: 0; }
#list-row2 .btn { flex: 0 0 auto; height: 40px; padding: 0 10px; font-size: 14px; }
#list-box { flex: 1; overflow-y: auto; background: var(--desk); padding: 10px; -webkit-overflow-scrolling: touch; }
.row { display: flex; align-items: center; background: var(--paper); padding: 6px 4px 6px 10px; margin-bottom: 8px; border-radius: 4px; }
.row .col { flex: 1; min-width: 0; }
.row .date { color: #7A8490; font-size: 12px; }
.row.small { padding: 3px 4px 3px 8px; margin-bottom: 4px; }
.row.small .first { flex: 0 0 auto; }
.row.small .date { flex: 1; text-align: right; }
.row .more { flex: 0 0 auto; width: 40px; height: 40px; border: 0; background: none; font-size: 22px; color: #7A8490; }
.empty { white-space: pre-line; font-size: 16px; color: #404850; padding: 24px 8px 8px; user-select: text; }

/* 書く */
#scr-edit .main { flex: 1; display: flex; min-height: 0; }
#ink { flex: 1; width: 100%; height: 100%; min-width: 0; }
#edit-side { display: none; flex-direction: column; width: 64px; padding: 3px 3px 0; }
#edit-side .btn { font-size: 15px; }
#edit-row1 { height: 56px; }
#edit-row2 { height: 60px; }
#scr-edit .bar:empty { display: none; }
#scr-edit.land #edit-side { display: flex; }
#scr-edit.land #edit-row1 { height: 46px; }
#scr-edit.land .btn { font-size: 15px; }

/* 図を描く */
.draw .bar { height: 52px; }
.draw .bar .btn { font-size: 14px; }
.drawcv { flex: 1; width: 100%; min-height: 0; }
.draw .colors { align-items: center; }
.swatch { flex: 1; min-width: 0; height: 100%; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center; }
.swatch::after {
  content: ''; width: 32px; height: 32px; border-radius: 50%; background: var(--c);
  box-shadow: 0 0 0 1.5px #fff;
}
.swatch.on::after { box-shadow: 0 0 0 4px #FFC94D; }
.btn.two { flex: 1.3; font-size: 13px !important; line-height: 1.05; }

/* 設定 */
#set-head { display: flex; align-items: center; padding: 4px 16px 4px 8px; color: #fff; font-size: 18px; font-weight: bold; }
#set-head .btn { flex: 0 0 auto; height: 42px; padding: 0 12px; margin-right: 12px; font-weight: normal; }
#set-box { flex: 1; overflow-y: auto; background: var(--desk); padding: 12px 16px 40px; -webkit-overflow-scrolling: touch; }
.section { background: #4A5A6A; color: #fff; font-size: 17px; font-weight: bold; padding: 6px 10px; margin-top: 16px; }
.note { font-size: 14px; color: #404850; padding: 6px 0 4px; white-space: pre-line; }
.label { font-size: 14px; font-weight: bold; color: var(--bar); padding: 14px 0 2px; }
.input { display: block; width: 100%; font-size: 16px; padding: 8px; border: 1px solid #aab; border-radius: 6px; background: #fff; user-select: text; -webkit-user-select: text; }
.check { display: flex; align-items: center; gap: 8px; font-size: 15px; padding: 8px 0 0; }
.check input { width: 22px; height: 22px; }
.result { font-size: 15px; color: #203040; padding: 12px 0; white-space: pre-line; user-select: text; -webkit-user-select: text; }
.ver { color: #889; font-size: 12px; padding-top: 24px; white-space: pre-line; user-select: text; -webkit-user-select: text; }

/* 箱（ダイアログ） */
.dlg-back { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
.dlg { background: #fff; border-radius: 12px; width: 100%; max-width: 440px; max-height: 88%; display: flex; flex-direction: column; overflow: hidden; }
.dlg-title { font-size: 18px; font-weight: bold; padding: 18px 20px 6px; }
.dlg-msg { font-size: 15px; padding: 6px 20px; white-space: pre-line; color: #333; }
.dlg-body { overflow-y: auto; padding: 4px 16px; }
.dlg-items { display: flex; flex-direction: column; padding: 4px 0; }
.dlg-item { border: 0; background: none; text-align: left; font-size: 16px; padding: 14px 20px; border-top: 1px solid #eee; }
.dlg-item:active { background: #eef; }
.dlg-btns { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 4px; padding: 8px 12px 12px; }
.dlg-btn { border: 0; background: none; color: #1E6FD9; font-size: 16px; padding: 10px 14px; }
.dlg-btn.strong { font-weight: bold; }
.figlist .btn.wide { height: 52px; background: #BFD9F2; color: #1C3D63; font-weight: bold; }
.figlist .hint { font-size: 14px; color: #555; padding: 12px 0 4px; }
.figrow { display: flex; align-items: center; padding: 6px 0; }
.figrow .thumb { flex: 0 0 auto; border: 1px solid #ddd; }
.figcol { flex: 1; padding-left: 10px; }
.figname { font-size: 16px; }
.figbtns { display: flex; }
.figbtns .btn { height: 44px; font-size: 15px; }

#toast {
  position: fixed; left: 50%; bottom: calc(110px + var(--sa-b)); transform: translateX(-50%); z-index: 20;
  max-width: 88%; background: rgba(60,60,60,0.92); color: #fff; font-size: 15px; padding: 12px 18px; border-radius: 22px;
  opacity: 0; pointer-events: none; transition: opacity .25s; text-align: center;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="scr-list" class="screen">
  <div id="list-head"></div>
  <div id="list-row2"></div>
  <div id="list-box"></div>
</div>
<div id="scr-edit" class="screen" hidden>
  <div class="main"><canvas id="ink"></canvas><div id="edit-side"></div></div>
  <div id="edit-row1" class="bar"></div>
  <div id="edit-row2" class="bar"></div>
</div>
<div id="scr-draw" class="screen" hidden></div>
<div id="scr-set" class="screen" hidden>
  <div id="set-head"><button id="set-back" class="btn" type="button">◀ 一覧</button>保存・バックアップ</div>
  <div id="set-box"></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
